name: Android Build and Release

on:
  push:
    branches:
      - main
      - development
      - release/*
      - fast-track/*
    tags: ["*"]
  pull_request:
    types: [ready_for_review, opened, reopened, auto_merge_enabled]
  workflow_dispatch:
    inputs:
      clo:
        description: "Assets/StreamingAssets/clo.json"
        required: false
        type: string
        default: ""
      version-code:
        description: "Google Play Console VersionCode"
      app-version:
        description: "Google Play Console VersionName ex(40.0.0)"
      package-name:
        description: "package name ex(com.planetariumlabs.ninechroniclesmobile)"
        required: false
        type: string
        default: "com.planetariumlabs.ninechroniclesmobile"
      cloud-project-id:
        description: "cloud project id ex(abcd-1234-xyz0)"
        required: false
        type: string
        default: ""
      player-name:
        description: "player name ex(Nine-Chronicles-M -> Nine Chronicles M)"
        required: false
        type: string
        default: "Nine-Chronicles-M"
      other-google-services:
        description: "Please turn on the option when build other package"
        required: false
        type: boolean
        default: false
      manual_build_option:
        description: "Please turn on the option when manually executing the action"
        type: boolean
        required: false
        default: false
      onestore:
        description: "원스토어 빌드로 만든다 (ONESTORE 심볼을 켠다). Google Play 업로드는 건너뛴다"
        type: boolean
        required: false
        default: false
      onestore-dev-option:
        description: "원스토어 테스트 환경. 비우면 상용. ex(onestore_03 = ONE Billing Lab 샌드박스)"
        type: string
        required: false
        default: ""

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.inputs.player-name }}
  cancel-in-progress: true

env:
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

jobs:
  build:
    name: Build for ${{ matrix.targetPlatform }}
    # 원스토어만 뽑는 수동 실행이면 구글 빌드는 건너뛴다.
    if: github.event.inputs.onestore != 'true'
    runs-on:
      group: linux-8cores
    defaults:
        run:
          shell: bash
    strategy:
      matrix:
        projectPath:
          - nekoyume
        targetPlatform:
          - Android
    environment: |-
      ${{ github.event.inputs.other-google-services == 'true' && 'k'
      || github.ref_name == 'main' && 'main'
      || startsWith(github.ref_name, 'release/') == 'true' && 'internal'
      || '' }}
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

    steps:
      - name: Set CRLF
        run: |
          git config --global core.autocrlf true

      - uses: actions/checkout@v3
        with:
          lfs: true
          submodules: true

      - uses: actions/cache@v3
        with:
          path: ${{ matrix.projectPath }}/Library
          key: Library-${{ matrix.projectPath }}-ubuntu-${{ matrix.targetPlatform }}
          restore-keys: |
            Library-${{ matrix.projectPath }}-ubuntu-
            Library-

      - name: Copy clo.json
        run: |
          if [ -n "${{ github.event.inputs.clo }}" ]; then
            echo ${{ github.event.inputs.clo }} > ${{ matrix.projectPath }}/Assets/StreamingAssets/clo.json
          fi

      - name: Decode google-services.json File
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > ${{ matrix.projectPath }}/Assets/NineChronicles/GoogleServices/google-services.json

      - name: Resolve AAR files
        run: |
          if [ '${{ github.event.inputs.other-google-services }}' == 'true' ]; then
            sudo \cp -R ${{ matrix.projectPath }}/ResolvedAAR/. ${{ matrix.projectPath }}/Assets/Plugins/Android/
          fi

      - name: Change cloudProjectId in ProjectSettings.asset
        run: |
          if [ -n "${{ github.event.inputs.cloud-project-id }}" ]; then
            sed -i '/cloudProjectId/c\  cloudProjectId: ${{ github.event.inputs.cloud-project-id }}' ${{ matrix.projectPath }}/ProjectSettings/ProjectSettings.asset
            cat ${{ matrix.projectPath }}/ProjectSettings/ProjectSettings.asset
          fi
      - uses: game-ci/unity-builder@v4
        with:
          androidKeystoreName: 9c-aos-signing-keystore.keystore # This file won't exist, but this property needs to exist.
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEY_ALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEY_ALIAS_PASS }}
          androidExportType: 'androidAppBundle'
          projectPath: ${{ matrix.projectPath }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildMethod: 'NekoyumeEditor.Builder.Build${{ matrix.targetPlatform }}'
          buildName: ${{ matrix.targetPlatform }}
          androidVersionCode: ${{ github.event.inputs.version-code }}
          version: ${{ github.event.inputs.app-version }}
          androidTargetSdkVersion: AndroidApiLevel36
          customParameters: -identifier ${{ github.event.inputs.package-name }} -playerName ${{ github.event.inputs.player-name }}
          allowDirtyBuild: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11.0

      - name: Install bundletool
        run: |
          tr -d "\r" < .github/bin/install-bundletool.sh > .github/bin/install-bundletool-trimed.sh
          bash .github/bin/install-bundletool-trimed.sh /tmp

      - name: Setup Keystore and Passwords
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/9c-signing-keystore.keystore
          echo "${{ secrets.ANDROID_KEYSTORE_PASS }}" > /tmp/keystore.pwd
          echo "${{ secrets.ANDROID_KEY_ALIAS_NAME }}" > /tmp/keyalias.name
          echo "${{ secrets.ANDROID_KEY_ALIAS_PASS }}" > /tmp/keyalias.pwd

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Print file content
        run: ls -R $GITHUB_WORKSPACE/build

      - name: Move Folder
        run: |
          sudo mv $GITHUB_WORKSPACE/build /tmp/player

      - name: Convert AAB to APKS
        run: |
          sudo java -jar /tmp/bundletool-all-*.jar build-apks --bundle="/tmp/player/Android/android-build.aab" --output="/tmp/player/Android/result.apks" --ks="/tmp/9c-signing-keystore.keystore" --ks-pass=file:/tmp/keystore.pwd --ks-key-alias=$(cat /tmp/keyalias.name) --key-pass=file:/tmp/keyalias.pwd --mode=universal --local-testing

      - name: Pack
        run: |
          targetPlatform=${{ matrix.targetPlatform }}

          tr -d "\r" < .github/bin/pack.sh > .github/bin/pack_trimed.sh
          rm .github/bin/pack.sh
          mv .github/bin/pack_trimed.sh .github/bin/pack.sh

          pip3 install wheel
          sudo bash .github/bin/pack.sh \
          /tmp/packages \
          "${{ matrix.targetPlatform }}" \
          "/tmp/player"

      - uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: /tmp/packages
          retention-days: 7
          if-no-files-found: error

  build-onestore:
    name: Build for ${{ matrix.targetPlatform }} (ONE Store)
    # 릴리즈 브랜치·태그에서는 구글 빌드와 함께 자동으로 뽑고,
    # 그 밖에는 onestore 를 켠 수동 실행에서만 뽑는다.
    if: >-
      startsWith(github.ref, 'refs/heads/release/')
      || startsWith(github.event.ref, 'refs/tags/')
      || github.event.inputs.onestore == 'true'
    runs-on:
      group: linux-8cores
    defaults:
        run:
          shell: bash
    strategy:
      matrix:
        projectPath:
          - nekoyume
        targetPlatform:
          - Android
    environment: |-
      ${{ github.event.inputs.other-google-services == 'true' && 'k'
      || github.ref_name == 'main' && 'main'
      || startsWith(github.ref_name, 'release/') == 'true' && 'internal'
      || '' }}
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

    steps:
      - name: Set CRLF
        run: |
          git config --global core.autocrlf true

      - uses: actions/checkout@v3
        with:
          lfs: true
          submodules: true

      # 스크립팅 심볼이 다르면 Unity 가 어차피 전부 다시 컴파일한다. 구글 빌드와 키를 공유하면
      # 두 잡이 서로의 캐시를 덮어써서 매번 재컴파일이 나므로 따로 둔다.
      - uses: actions/cache@v3
        with:
          path: ${{ matrix.projectPath }}/Library
          key: Library-${{ matrix.projectPath }}-ubuntu-${{ matrix.targetPlatform }}-onestore
          restore-keys: |
            Library-${{ matrix.projectPath }}-ubuntu-${{ matrix.targetPlatform }}-onestore
            Library-${{ matrix.projectPath }}-ubuntu-
            Library-

      - name: Copy clo.json
        run: |
          if [ -n "${{ github.event.inputs.clo }}" ]; then
            echo ${{ github.event.inputs.clo }} > ${{ matrix.projectPath }}/Assets/StreamingAssets/clo.json
          fi

      - name: Decode google-services.json File
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > ${{ matrix.projectPath }}/Assets/NineChronicles/GoogleServices/google-services.json

      - name: Resolve AAR files
        run: |
          if [ '${{ github.event.inputs.other-google-services }}' == 'true' ]; then
            sudo \cp -R ${{ matrix.projectPath }}/ResolvedAAR/. ${{ matrix.projectPath }}/Assets/Plugins/Android/
          fi

      - name: Change cloudProjectId in ProjectSettings.asset
        run: |
          if [ -n "${{ github.event.inputs.cloud-project-id }}" ]; then
            sed -i '/cloudProjectId/c\  cloudProjectId: ${{ github.event.inputs.cloud-project-id }}' ${{ matrix.projectPath }}/ProjectSettings/ProjectSettings.asset
            cat ${{ matrix.projectPath }}/ProjectSettings/ProjectSettings.asset
          fi
      # 스크립팅 심볼은 컴파일 시점에 정해진다. unity-builder 가 Unity 를 띄우면 그 안에서
      # 이미 컴파일이 끝나므로, -executeMethod 로 심볼을 켜도 #if ONESTORE 가 먹지 않는다.
      # 그래서 위의 cloudProjectId 와 같은 방식으로 빌드 전에 파일을 고친다.
      #
      # 맨 위 Set CRLF 때문에 체크아웃이 CRLF 다. `.*` 가 줄 끝 CR 까지 삼키면 ;ONESTORE 가
      # CR **뒤에** 붙어 앞 심볼 끝에 CR 이 남는다. 스크립트 컴파일은 그대로 통과하므로
      # 한참 뒤 Burst 가 그 인자를 못 읽고 죽는다(Unexpected arguments). CR 은 줄 끝에 그대로 둔다.
      - name: Enable ONESTORE define
        run: |
          set -euo pipefail
          f='${{ matrix.projectPath }}/ProjectSettings/ProjectSettings.asset'
          # 파일에 "    Android:" 로 시작하는 줄이 여럿이라 범위를 심볼 블록으로 한정한다.
          sed -i -E '/^  scriptingDefineSymbols:/,/^  additionalCompilerArguments:/ s/^(    Android: .*[^[:cntrl:]])(\r?)$/\1;ONESTORE\2/' "$f"
          line=$(awk '/^  scriptingDefineSymbols:/{f=1} f && /^    Android: /{print; exit}' "$f")
          body=${line%$'\r'}
          printf '%s\n' "$body"
          case "$body" in
            *$'\r'*) echo "심볼 사이에 CR 이 남았다. Burst 가 죽는다"; exit 1 ;;
            *';ONESTORE') ;;
            *) echo "ONESTORE 심볼 주입 실패"; exit 1 ;;
          esac

      - name: Enable ONE Store dev option
        if: ${{ github.event.inputs.onestore-dev-option != '' }}
        run: |
          set -euo pipefail
          f='${{ matrix.projectPath }}/Assets/Plugins/Android/AndroidManifest.xml'
          opt='${{ github.event.inputs.onestore-dev-option }}'
          sed -i 's|<!-- <meta-data android:name="onestore:dev_option" [^>]*/> -->|<meta-data android:name="onestore:dev_option" android:value="'"$opt"'" />|' "$f"
          grep -q "android:name=\"onestore:dev_option\" android:value=\"$opt\"" "$f" \
            || { echo "dev_option 주입 실패"; exit 1; }
          echo "dev_option = $opt (테스트 환경이다. 상용 제출본에 쓰지 말 것)"

      - uses: game-ci/unity-builder@v4
        with:
          androidKeystoreName: 9c-aos-signing-keystore.keystore # This file won't exist, but this property needs to exist.
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEY_ALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEY_ALIAS_PASS }}
          androidExportType: 'androidAppBundle'
          projectPath: ${{ matrix.projectPath }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildMethod: 'NekoyumeEditor.Builder.Build${{ matrix.targetPlatform }}'
          buildName: ${{ matrix.targetPlatform }}
          androidVersionCode: ${{ github.event.inputs.version-code }}
          version: ${{ github.event.inputs.app-version }}
          androidTargetSdkVersion: AndroidApiLevel36
          customParameters: -identifier ${{ github.event.inputs.package-name }} -playerName ${{ github.event.inputs.player-name }}
          allowDirtyBuild: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11.0

      - name: Install bundletool
        run: |
          tr -d "\r" < .github/bin/install-bundletool.sh > .github/bin/install-bundletool-trimed.sh
          bash .github/bin/install-bundletool-trimed.sh /tmp

      - name: Setup Keystore and Passwords
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/9c-signing-keystore.keystore
          echo "${{ secrets.ANDROID_KEYSTORE_PASS }}" > /tmp/keystore.pwd
          echo "${{ secrets.ANDROID_KEY_ALIAS_NAME }}" > /tmp/keyalias.name
          echo "${{ secrets.ANDROID_KEY_ALIAS_PASS }}" > /tmp/keyalias.pwd

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Print file content
        run: ls -R $GITHUB_WORKSPACE/build

      - name: Move Folder
        run: |
          sudo mv $GITHUB_WORKSPACE/build /tmp/player

      - name: Convert AAB to APKS
        run: |
          sudo java -jar /tmp/bundletool-all-*.jar build-apks --bundle="/tmp/player/Android/android-build.aab" --output="/tmp/player/Android/result.apks" --ks="/tmp/9c-signing-keystore.keystore" --ks-pass=file:/tmp/keystore.pwd --ks-key-alias=$(cat /tmp/keyalias.name) --key-pass=file:/tmp/keyalias.pwd --mode=universal --local-testing

      - name: Pack
        run: |
          targetPlatform=${{ matrix.targetPlatform }}

          tr -d "\r" < .github/bin/pack.sh > .github/bin/pack_trimed.sh
          rm .github/bin/pack.sh
          mv .github/bin/pack_trimed.sh .github/bin/pack.sh

          pip3 install wheel
          sudo bash .github/bin/pack.sh \
          /tmp/packages \
          "${{ matrix.targetPlatform }}" \
          "/tmp/player"

      - uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.targetPlatform }}-OneStore
          path: /tmp/packages
          retention-days: 7
          if-no-files-found: error

      # `.apks` 는 bundletool 아카이브라 그대로는 설치가 안 된다. `--mode=universal` 이
      # 넣어 준 universal.apk 를 꺼내 QA 가 바로 받을 수 있는 이름으로 바꾼다.
      #
      # 아티팩트 업로드 **뒤에** 둔다. 이 편의 기능이 실패해도 릴리즈 산출물은 이미 남아 있어야 한다.
      - name: Extract universal APK
        id: apk
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/onestore
          ver=$(awk '/^  bundleVersion:/{print $2; exit}' nekoyume/ProjectSettings/ProjectSettings.asset | tr -d '\r')
          [ -n "$ver" ] || ver=unknown
          name="NineChronicles-onestore-${ver}-${{ github.run_id }}.apk"
          # 읽기만 sudo 로 하고 쓰기는 runner 소유로 한다 — sudo 로 만든 파일의 모드에 기대지 않는다.
          sudo unzip -p /tmp/player/Android/result.apks universal.apk > "/tmp/onestore/${name}"
          size=$(stat -c%s "/tmp/onestore/${name}")
          [ "$size" -gt 0 ] || { echo "universal.apk 추출 실패"; exit 1; }
          echo "path=/tmp/onestore/${name}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "size=${size}" >> "$GITHUB_OUTPUT"
          echo "원스토어 APK: ${name} ($((size / 1024 / 1024))MB)"

      # 슬랙 쪽 문제(토큰 스코프·채널 권한)로 릴리즈 빌드가 깨지면 안 된다.
      - name: Upload ONE Store APK to Slack
        if: steps.apk.outcome == 'success'
        continue-on-error: true
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_NAME: ${{ steps.apk.outputs.name }}
          APK_SIZE: ${{ steps.apk.outputs.size }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # secrets 컨텍스트는 스텝 `if` 에서 못 쓴다. 여기서 확인한다.
          if [ -z "${SLACK_TOKEN}" ] || [ -z "${SLACK_CHANNEL}" ]; then
            echo "SLACK_TOKEN/SLACK_CHANNEL 이 없어 업로드를 건너뛴다."
            exit 0
          fi

          # chat.postMessage 는 채널 이름도 ID 도 받고, **응답의 .channel 은 항상 ID** 다.
          # files.completeUploadExternal 이 ID 만 받으므로 여기서 얻는다(추가 스코프 불필요).
          post_text() {
            local res
            res=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer ${SLACK_TOKEN}" \
              -H 'Content-Type: application/json; charset=utf-8' \
              --data "$(jq -nc --arg c "$SLACK_CHANNEL" --arg t "$1" '{channel:$c, text:$t}')")
            if ! echo "$res" | jq -e '.ok' > /dev/null; then
              echo "chat.postMessage 실패: $res" >&2
              return 1
            fi
            echo "$res" | jq -r '.channel'
          }

          # 토큰이 뭘 할 수 있는지 로그에 남긴다. 파일 업로드엔 files:write 가 필요한데,
          # 이 토큰은 지금까지 chat:write 로만 검증돼 있었다. 스코프는 응답 헤더로 온다.
          scopes=$(curl -sS -D - -o /dev/null -H "Authorization: Bearer ${SLACK_TOKEN}" \
            https://slack.com/api/auth.test | tr -d '\r' | awk -F': ' '/^[Xx]-[Oo][Aa]uth-[Ss]copes:/{print $2}')
          echo "슬랙 토큰 스코프: ${scopes:-확인 불가}"

          mb=$((APK_SIZE / 1024 / 1024))

          # 슬랙 파일 한도는 1GB 다. 넘으면 올리지 않고 아티팩트 링크만 알린다.
          if [ "$APK_SIZE" -gt $((1024 * 1024 * 1024)) ]; then
            echo "APK 가 슬랙 한도(1GB)를 넘어 파일 업로드를 건너뛴다."
            post_text "[Player] Prepared 'ONE Store' apk (${APK_NAME}, ${mb}MB) — 슬랙 한도 초과라 아티팩트로 받으세요: ${RUN_URL}" > /dev/null
            exit 0
          fi

          channel_id=$(post_text "[Player] Prepared 'ONE Store' apk - ${APK_NAME} (${mb}MB)")
          echo "슬랙 채널 ID: ${channel_id}"

          # 업로드가 안 되면 조용히 끝내지 않는다 — QA 는 슬랙만 보고 기다린다.
          fallback() {
            echo "$1" >&2
            post_text "[Player] 'ONE Store' apk 슬랙 업로드 실패 — 아티팩트로 받으세요: ${RUN_URL}" > /dev/null || true
            exit 0
          }

          # files.upload 은 폐기됐다. 외부 업로드 3단계를 쓴다.
          up=$(curl -sS -X POST https://slack.com/api/files.getUploadURLExternal \
            -H "Authorization: Bearer ${SLACK_TOKEN}" \
            --data-urlencode "filename=${APK_NAME}" \
            --data-urlencode "length=${APK_SIZE}")
          echo "$up" | jq -e '.ok' > /dev/null || fallback "getUploadURLExternal 실패: $up"

          curl -sS --fail -X POST "$(echo "$up" | jq -r '.upload_url')" \
            -F "file=@${APK_PATH}" > /dev/null || fallback "업로드 전송 실패"

          res=$(curl -sS -X POST https://slack.com/api/files.completeUploadExternal \
            -H "Authorization: Bearer ${SLACK_TOKEN}" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$(jq -nc \
              --arg id "$(echo "$up" | jq -r '.file_id')" \
              --arg t "$APK_NAME" \
              --arg c "$channel_id" \
              '{files:[{id:$id, title:$t}], channel_id:$c}')")
          echo "$res" | jq -e '.ok' > /dev/null || fallback "completeUploadExternal 실패: $res"
          echo "슬랙 업로드 완료: ${APK_NAME}"

  extract:
    if: >-
      (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.event.ref, 'refs/tags/'))
      && github.event.inputs.onestore != 'true'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      network: ${{ steps.extract.outputs.network }}
    steps:
      - uses: actions/checkout@v3
      - name: extract
        id: extract
        run: |
          if [[ "${{ startsWith(github.ref, 'refs/heads/release/') }}" == "true" || "${{ github.event.inputs.manual_build_option }}" == "true" ]]; then
              echo "::set-output name=network::internal"
          elif [[ "${{ startsWith(github.event.ref, 'refs/tags/') }}" == "true" ]]; then
              echo "::set-output name=network::main"
          else
            echo "::set-output name=network::null"
          fi

  release-to-google-play:
    if: >-
      (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.event.ref, 'refs/tags/'))
      && github.event.inputs.onestore != 'true'
    name: Release to the Google Play Store
    runs-on: ubuntu-latest
    needs: ["extract"]
    environment:
      name: ${{ needs.extract.outputs.network }}
    env:
      GOOGLE_PLAY_KEY_FILE: ${{ secrets.GOOGLE_PLAY_KEY_FILE }}
      GOOGLE_PLAY_KEY_FILE_PATH:
        ${{ format('{0}/fastlane/google-fastlane.json', github.workspace) }}
      ANDROID_BUILD_FILE_PATH: ${{ format('{0}/build/Android/android-build.aab', github.workspace) }}
      ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: Build-Android
          path: build
      - name: unzip artifact for deployment
        run: |
          mkdir -p build/Android
          unzip build/Android.zip -d build/Android
      - name: Add Authentication
        run: |
          echo ${{secrets.GOOGLE_PLAY_KEY_FILE}} | base64 -d > ${{ env.GOOGLE_PLAY_KEY_FILE_PATH }}
      - name: Set up Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.7.2
          bundler-cache: true
      - name: Upload to Google Play Internal
        uses: maierj/fastlane-action@v3.0.0
        with:
          lane: 'android internal'
